name: IndexNow

# Avisa o Bing (e os outros motores IndexNow) das páginas novas ou alteradas depois de cada deploy.
# Só corre quando algum sitemap muda; espera que o GitHub Pages publique o sitemap.xml novo antes de enviar.
# A Google não usa IndexNow. Script e regras: scripts/indexnow.js e CLAUDE.md ("SEO — regras da Google").

on:
  push:
    branches:
      - main
    paths:
      - "sitemap*.xml"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send changed URLs to IndexNow
        run: node scripts/indexnow.js --days 2 --send --wait
